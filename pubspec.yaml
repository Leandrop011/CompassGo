name: compass_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  animate_do: ^5.1.0
  flutter:
    sdk: flutter
  flutter_compass: ^0.8.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_riverpod: ^3.3.1
  flutter_staggered_grid_view: ^0.7.0
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  lottie: ^3.3.3
  permission_handler: ^12.0.3
  riverpod: ^3.2.1
  shared_preferences: ^2.5.5
  smooth_page_indicator: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon-app/
    - assets/images/compass_images/
    - assets/splash_images/
    - assets/animations/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon-app/icon-01.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

flutter_native_splash:
  color: "#000000" 
  image: assets/splash_images/splash-01.png
  fullscreen: true 
  android: true
  android_12:
    color: "#000000"
    image: assets/splash_images/splash-01.png
    icon_background_color: "#000000"
